<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Folio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap">
<style>
/* Folio — encre, papier, signet. --bg / --fg suivent le thème de lecture (posés par app.js). */
:root{--bg:#fbfbfa;--fg:#222222;--ac:#6d5bd0;--acfg:#fff;
 --muted:color-mix(in srgb,var(--fg) 56%,var(--bg));--line:color-mix(in srgb,var(--fg) 12%,var(--bg));
 --soft:color-mix(in srgb,var(--fg) 6%,var(--bg));--surface:color-mix(in srgb,var(--fg) 3.5%,var(--bg));
 --ink:var(--fg);--inkfg:var(--bg);
 --serif:"Fraunces",Georgia,"Iowan Old Style",serif;
 --shadow:0 1px 2px rgba(0,0,0,.07),0 12px 30px -8px rgba(0,0,0,.22);--r:16px;--ease:cubic-bezier(.2,.8,.2,1)}
:root.dark{--ac:#a798ff;--acfg:#15122a;--shadow:0 1px 2px rgba(0,0,0,.45),0 14px 34px -8px rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
 font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;transition:background .3s,color .3s}
button,select,input{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--ac) 28%,transparent)}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg) 34%,transparent)}::-webkit-scrollbar-button{display:none}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 25%,transparent) transparent}}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;transition:background .15s,color .15s}
.ib:hover{background:var(--soft)}.ib:active{transform:scale(.94)}.ib.on{color:var(--ac)}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--soft);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .1s,background .15s}
.btn:hover{background:color-mix(in srgb,var(--fg) 10%,var(--bg))}
.btn:active{transform:scale(.97)}.btn.pri{background:var(--ink);color:var(--inkfg)}.btn.pri:hover{filter:brightness(1.15)}
:root.dark .btn.pri:hover{filter:brightness(.9)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.btn.ghost:hover{background:var(--soft)}.btn.danger{color:#d4473a}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-variation-settings:"opsz" 40}

/* ---------- bibliothèque ---------- */
#lib{height:100%;overflow:auto;padding:0 0 calc(env(safe-area-inset-bottom) + 56px)}
.head{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 14px) 28px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.head-row{display:flex;align-items:center;gap:4px;max-width:1180px;margin:0 auto}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px}:root.dark .brand img{box-shadow:0 0 0 1px var(--line)}
.brand h1{margin:0;font-size:27px;font-style:italic;font-weight:480;letter-spacing:-.02em;font-variation-settings:"opsz" 72,"SOFT" 50}
.head .btn.pri{margin-left:8px}
.search{max-width:1180px;margin:10px auto 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:0 2px;color:var(--muted);transition:border-color .2s}
.search:focus-within{border-color:var(--fg);color:var(--fg)}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none;color:var(--fg);font-size:15px}
main{max-width:1180px;margin:0 auto;padding:6px 28px}
.site-lnk{display:block;width:max-content;margin:56px auto calc(env(safe-area-inset-bottom) + 18px);font-size:12px;color:var(--muted);opacity:.55;text-decoration:none;letter-spacing:.02em}
.site-lnk:hover{opacity:1;color:var(--ac)}
#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:25;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);
 background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:var(--shadow);font-size:14px}
#upd[hidden]{display:none}#upd .btn{padding:8px 14px}
/* reprendre la lecture : la couverture teinte la carte */
.hero{position:relative;isolation:isolate;overflow:hidden;display:flex;gap:30px;align-items:center;padding:30px 34px;margin:14px 0 40px;border-radius:26px;cursor:pointer;
 background:var(--surface);transition:transform .25s var(--ease)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 7%,transparent)}
.hero:hover{transform:translateY(-2px)}.hero:hover .cover{transform:rotate(-2deg) translateY(-3px)}
.hero .cover{width:118px;flex:none;transform:rotate(-1deg);transition:transform .35s var(--ease)}
.hero .meta{min-width:0;flex:1}
.kicker{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.12em;color:var(--ac)}
.hero h2{margin:8px 0 4px;font-size:32px;line-height:1.08;font-weight:450;font-variation-settings:"opsz" 96;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .by{color:var(--muted);margin-bottom:18px;font-family:var(--serif);font-style:italic;font-size:17px}
.hero .prog{max-width:360px}
.sect{display:flex;align-items:baseline;gap:14px;margin:8px 0 18px}
.sect h3{margin:0;font-size:23px;font-weight:480}
.sect::after{content:"";flex:1;height:1px;background:var(--line);align-self:center;order:1}
.sect>span,.sect .tools{order:2}.sect span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:34px 26px}
.card{cursor:pointer;position:relative;min-width:0}
/* couverture = objet : dos ombré à gauche, tranche de pages à droite */
.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:var(--shadow);color:#fff;display:flex;align-items:flex-end;padding:14px;
 font-family:var(--serif);font-weight:500;font-size:16px;line-height:1.2;position:relative;transition:transform .3s var(--ease),box-shadow .3s}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 2.5%,rgba(0,0,0,0) 6%,rgba(0,0,0,0) 94%,rgba(255,255,255,.08));
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card:hover .cover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 2px 4px rgba(0,0,0,.08),0 22px 40px -12px rgba(0,0,0,.35)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g0{background:linear-gradient(165deg,#4a5c78,#1f2838)}.g1{background:linear-gradient(165deg,#7a4b3a,#33190f)}.g2{background:linear-gradient(165deg,#5b6b4a,#232c19)}
.g3{background:linear-gradient(165deg,#8a6a3c,#3a2a12)}.g4{background:linear-gradient(165deg,#6e4a63,#2c1626)}.g5{background:linear-gradient(165deg,#3f6b6b,#142d2d)}
.card .t{margin-top:12px;font-family:var(--serif);font-weight:500;font-size:16px;line-height:1.22;font-variation-settings:"opsz" 24;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .tr{flex:1;height:2px;border-radius:2px;background:var(--line);overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--ac)}
.hero .prog{font-size:13px}.hero .prog .tr{height:3px}
/* « Terminé » : un signet posé sur la couverture */
.badge{position:absolute;top:0;left:12px;z-index:2;background:var(--ac);color:var(--acfg);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
 padding:8px 6px 14px;writing-mode:vertical-rl;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.more{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
.more svg.i{width:16px;height:16px}.card:hover .more,.more:focus{opacity:1}
@media (hover:none){.more{opacity:.85}}
.empty{text-align:center;padding:80px 20px;color:var(--muted);max-width:460px;margin:0 auto}
.empty>svg{width:64px;height:64px;stroke-width:1.1;color:var(--ac)}
.empty h2{color:var(--fg);margin:16px 0 8px;font-size:30px;font-style:italic;font-weight:420;font-variation-settings:"opsz" 96}
.drop{position:fixed;inset:14px;border:2px dashed var(--ac);border-radius:28px;background:color-mix(in srgb,var(--ac) 9%,var(--bg));z-index:90;display:none;place-items:center;
 font:italic 500 28px var(--serif);color:var(--ac)}
body.dragging .drop{display:grid}

/* ---------- lecteur ---------- */
#rd{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:20}
#rd.on{display:flex;animation:rdIn .35s var(--ease)}
@keyframes rdIn{from{opacity:0;transform:scale(.985)}}
#top{display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;transition:margin .3s var(--ease),opacity .25s}
#top .tt{flex:1;min-width:0;padding:0 8px;text-align:center}
#ttl{font-family:var(--serif);font-weight:500;font-size:15.5px;font-variation-settings:"opsz" 24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapTop{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#top #bBack{margin-right:84px}
#rd.full #top{margin-top:-80px;opacity:0;pointer-events:none}
#view{flex:1;position:relative;min-height:0;overflow:hidden}
#viewer{position:absolute;inset:0;margin:0 auto;max-width:var(--mw,100%)}
#foot{padding:6px 24px calc(env(safe-area-inset-bottom) + 12px);display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);transition:opacity .3s}
#rd.full #foot{opacity:.3}
#chap{max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);font-style:italic;font-size:13px}
#pct{font-family:var(--serif);font-size:13px;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
#viewer{will-change:transform}
#pinch{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.9);z-index:8;background:color-mix(in srgb,var(--fg) 90%,transparent);color:var(--bg);padding:12px 22px;border-radius:18px;
 font:500 22px var(--serif);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#pinch.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:15;width:42px;height:42px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ac);opacity:0;transform:translate(-50%,-60px);transition:transform .25s,opacity .25s;pointer-events:none}
#ptr.busy svg{animation:spin 1s linear infinite}
.card.press .cover{transform:scale(.96)}

/* ---------- panneaux : feuille en bas sur téléphone, tiroir à droite sur grand écran ---------- */
#scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 30%,transparent);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:86%;overflow:auto;overscroll-behavior:contain;background:var(--bg);color:var(--fg);border-radius:28px 28px 0 0;
 padding:10px 22px calc(env(safe-area-inset-bottom) + 24px);box-shadow:0 -12px 50px rgba(0,0,0,.25);z-index:40;transform:translate(-50%,calc(105% + 20px));transition:transform .32s var(--ease)}
.sheet:not(.on){visibility:hidden;transition:transform .32s var(--ease),visibility 0s .32s}
.sheet.on{transform:translate(-50%,var(--dy,0px))}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:4px 0 16px;font-size:26px;font-weight:450;font-variation-settings:"opsz" 72;display:flex;align-items:center;justify-content:space-between}
@media (min-width:900px){
 .sheet{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:28px 0 0 28px;padding:26px 30px 30px;transform:translateX(105%);box-shadow:-20px 0 60px rgba(0,0,0,.18)}
 .sheet.on{transform:none}.grab{display:none}
 #scrim{background:color-mix(in srgb,#000 14%,transparent)}}
.group{border:1px solid var(--line);border-radius:var(--r);padding:2px 16px;margin:12px 0}
.row{display:flex;align-items:center;gap:14px;min-height:52px;justify-content:space-between}
.row+.row{border-top:1px solid var(--line)}
.row.stack{flex-direction:column;align-items:stretch;gap:8px;padding:12px 0}
.row label{font-weight:550}.row output{min-width:40px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row .ctl{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;max-width:220px;height:2px;border-radius:2px;outline:none;
 background:linear-gradient(var(--fg),var(--fg)) 0/var(--v,50%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--fg);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;max-width:200px}
.switch{position:relative;width:46px;height:28px;flex:none}.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.switch input:checked+span{background:var(--ac)}.switch input:checked+span::after{transform:translateX(18px)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .15s}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* thèmes : de petites pages, coin corné */
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sub{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:22px 4px 0}
.theme{position:relative;border:0;border-radius:6px 14px 6px 6px;aspect-ratio:4/5;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;
 box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent);clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);transition:transform .2s var(--ease)}
.theme:hover{transform:translateY(-2px)}
.theme::after{content:"";position:absolute;top:0;right:0;width:14px;height:14px;background:linear-gradient(225deg,transparent 50%,color-mix(in srgb,currentColor 22%,transparent) 50%)}
.theme b{font:500 22px/1 var(--serif)}
.theme.on{box-shadow:inset 0 0 0 2px var(--ac)}
.theme.on::before{content:"";position:absolute;top:0;left:10px;width:9px;height:16px;background:var(--ac);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.colors{display:flex;gap:10px;align-items:center}
.colors input[type=color]{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colors input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
#list{margin-top:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;cursor:pointer}
.item:hover{background:var(--soft)}.item .tx{flex:1;min-width:0}.item .tx small{display:block;color:var(--muted);font-size:12px}
.item .dot{width:6px;align-self:stretch;border-radius:9px;flex:none}
.item.cur{color:var(--ac);font-weight:650}
.hint{color:var(--muted);text-align:center;padding:26px 10px}
.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 10%,transparent)}
.who{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--inkfg);display:grid;place-items:center;font:500 19px var(--serif);flex:none}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;justify-content:center}
.avbig{width:104px;height:104px;font-size:44px;margin:4px auto 12px;position:relative;overflow:hidden}
.avatar img,.avbig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.avatar{position:relative;overflow:hidden}
#bCfg .mini{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--inkfg);display:grid;place-items:center;font:500 14px var(--serif);position:relative;overflow:hidden}
#bCfg .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof{text-align:center;margin-bottom:6px}.prof h4{margin:0;font-size:24px;font-weight:450}.prof p{margin:2px 0 12px;color:var(--muted)}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:24px 2px 8px}
.inl{display:flex;gap:8px;align-items:center}.inl .field{flex:1;margin:6px 0}.stat{display:flex;gap:10px}
.stat div{flex:1;padding:14px 12px;border-radius:14px;border:1px solid var(--line);text-align:center}
.stat b{display:block;font:500 26px/1.1 var(--serif)}.stat span{font-size:12px;color:var(--muted)}
.link{background:none;border:0;color:var(--ac);padding:0;font-weight:600;cursor:pointer;font-size:14px}
.note{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 10%,var(--bg));margin:10px 0;font-size:14px;line-height:1.45}
.mut{color:var(--muted);font-size:14px;margin:0 0 8px}.center{text-align:center}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin:12px 0}
.codes span{padding:9px;border-radius:10px;border:1px solid var(--line);text-align:center;user-select:all}
.qr{display:block;margin:6px auto 10px;width:220px;height:220px;border-radius:16px;background:#fff;padding:8px}
.secret{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;text-align:center;padding:10px;border-radius:12px;border:1px dashed var(--line);user-select:all}
.sess{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.sess:last-child{border-bottom:0}
.sess .tx{flex:1;min-width:0}.sess small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,var(--bg));color:var(--ac);white-space:nowrap}
.ok{color:#3c9a5f}.warn{color:#d0812e}
