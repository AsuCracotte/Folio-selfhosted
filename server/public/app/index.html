<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Folio</title>
<style>
:root{--bg:#fbfbfa;--fg:#222222;--ac:#6d5bd0;--acfg:#fff;
 --muted:color-mix(in srgb,var(--fg) 58%,var(--bg));--line:color-mix(in srgb,var(--fg) 11%,var(--bg));
 --soft:color-mix(in srgb,var(--fg) 6%,var(--bg));--surface:color-mix(in srgb,var(--fg) 3%,var(--bg));
 --shadow:0 1px 2px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.14);--r:18px}
:root.dark{--ac:#a798ff;--acfg:#15122a;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
 font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
button,select,input{font:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 20%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg) 38%,transparent)}::-webkit-scrollbar-button{display:none}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 25%,transparent) transparent}}
button{cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;transition:background .15s}
.ib:hover{background:var(--soft)}.ib:active{transform:scale(.94)}.ib.on{color:var(--ac)}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--soft);font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}.btn.pri{background:var(--ac);color:var(--acfg)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{color:#e5484d}
/* ---------- bibliothèque ---------- */
#lib{height:100%;overflow:auto;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
.head{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.head-row{display:flex;align-items:center;gap:6px;max-width:1180px;margin:0 auto}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:30px;border-radius:9px}
.brand h1{margin:0;font-size:22px;letter-spacing:-.02em}
.search{max-width:1180px;margin:12px auto 0;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:0 14px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;color:var(--fg)}
main{max-width:1180px;margin:0 auto;padding:4px 20px}
.hero{display:flex;gap:20px;align-items:center;padding:18px;margin:10px 0 26px;border-radius:24px;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .15s}
.hero:hover{transform:translateY(-2px)}
.hero .cover{width:96px;flex:none}
.hero .meta{min-width:0;flex:1}
.kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}
.hero h2{margin:4px 0 2px;font-size:20px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .by{color:var(--muted);margin-bottom:12px}
.hero .prog{max-width:320px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px}
.sect h3{margin:0;font-size:17px}.sect span{color:var(--muted);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:26px 20px}
.card{cursor:pointer;position:relative;min-width:0}
.cover{aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);color:#fff;display:flex;align-items:flex-end;padding:14px;font-weight:700;font-size:15px;line-height:1.25;position:relative;transition:transform .2s,box-shadow .2s}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 6px 0 10px -6px rgba(0,0,0,.35);pointer-events:none}
.card:hover .cover{transform:translateY(-4px)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g0{background:linear-gradient(160deg,#6d5bd0,#2b1f6b)}.g1{background:linear-gradient(160deg,#3d7ea6,#16384f)}.g2{background:linear-gradient(160deg,#c06c52,#5e2618)}
.g3{background:linear-gradient(160deg,#4f8a6a,#1d3b2b)}.g4{background:linear-gradient(160deg,#a8577e,#4a1d36)}.g5{background:linear-gradient(160deg,#8a7a4f,#3d3417)}
.card .t{margin-top:10px;font-weight:650;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .a{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--muted)}
.prog .tr{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}.prog .tr i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.badge{position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.more{position:absolute;top:6px;right:6px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
.more svg.i{width:16px;height:16px}.card:hover .more,.more:focus{opacity:1}
@media (hover:none){.more{opacity:.9}}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty>svg{width:84px;height:84px;stroke-width:1.2;color:var(--ac);opacity:.8}
.empty h2{color:var(--fg);margin:14px 0 6px;font-size:20px}
.drop{position:fixed;inset:12px;border:3px dashed var(--ac);border-radius:28px;background:color-mix(in srgb,var(--ac) 12%,transparent);z-index:90;display:none;place-items:center;font-weight:700;font-size:20px;color:var(--ac)}
body.dragging .drop{display:grid}
/* ---------- lecteur ---------- */
#rd{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:20}
#rd.on{display:flex}
#top{display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;transition:margin .25s,opacity .25s}
#top .tt{flex:1;min-width:0;padding:0 6px}
#ttl{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chapTop{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rd.full #top{margin-top:-80px;opacity:0;pointer-events:none}
#view{flex:1;position:relative;min-height:0;overflow:hidden}
#viewer{position:absolute;inset:0;margin:0 auto;max-width:var(--mw,100%)}
#foot{padding:6px 22px calc(env(safe-area-inset-bottom) + 10px);display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
#rd.full #foot{opacity:.35}
#chap{max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{will-change:transform}
#pinch{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.9);z-index:8;background:color-mix(in srgb,var(--fg) 88%,transparent);color:var(--bg);padding:12px 20px;border-radius:18px;font-weight:700;font-size:18px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#pinch.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);z-index:15;width:42px;height:42px;border-radius:50%;background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ac);opacity:0;transform:translate(-50%,-60px);transition:transform .25s,opacity .25s;pointer-events:none}
#ptr.busy svg{animation:spin 1s linear infinite}
.card.press .cover{transform:scale(.96)}
/* ---------- panneaux ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:82%;overflow:auto;background:var(--bg);color:var(--fg);border-radius:26px 26px 0 0;
 padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.28);z-index:40;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
.sheet:not(.on){visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.sheet.on{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:2px 0 14px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;margin:12px 0}
.row{display:flex;align-items:center;gap:14px;min-height:52px;justify-content:space-between}
.row+.row{border-top:1px solid var(--line)}
.row.stack{flex-direction:column;align-items:stretch;gap:8px;padding:12px 0}
.row label{font-weight:550}.row output{min-width:38px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.row .ctl{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;max-width:220px;height:4px;border-radius:9px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ac);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.35)}
select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;max-width:200px}
.switch{position:relative;width:48px;height:28px;flex:none}.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--ac)}.switch input:checked+span::after{transform:translateX(20px)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 4px 0}
.theme{border:2px solid var(--line);border-radius:16px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.theme b{font:700 20px Georgia,serif}.theme.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.colors{display:flex;gap:10px;align-items:center}
.colors input[type=color]{width:34px;height:34px;border:2px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colors input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
#list{margin-top:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;cursor:pointer}
.item:hover{background:var(--soft)}.item .tx{flex:1;min-width:0}.item .tx small{display:block;color:var(--muted);font-size:12px}
.item .dot{width:6px;align-self:stretch;border-radius:9px;flex:none}
.item.cur{color:var(--ac);font-weight:650}
.hint{color:var(--muted);text-align:center;padding:26px 10px}
.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 4px}
.field input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:none}
.field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.who{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acfg);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;justify-content:center}
.avbig{width:104px;height:104px;font-size:42px;margin:4px auto 10px;position:relative;overflow:hidden}
.avatar img,.avbig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.avatar{position:relative;overflow:hidden}
#bCfg .mini{width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--acfg);display:grid;place-items:center;font-weight:700;font-size:13px;position:relative;overflow:hidden}
#bCfg .mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prof{text-align:center;margin-bottom:6px}.prof h4{margin:0;font-size:20px}.prof p{margin:2px 0 12px;color:var(--muted)}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 4px 6px}
.inl{display:flex;gap:8px;align-items:center}.inl .field{flex:1;margin:6px 0}.stat{display:flex;gap:10px}.stat div{flex:1;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.link{background:none;border:0;color:var(--ac);padding:0;font-weight:600;cursor:pointer;font-size:14px}
.note{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 12%,var(--bg));margin:10px 0;font-size:14px;line-height:1.45}
.mut{color:var(--muted);font-size:14px;margin:0 0 8px}.center{text-align:center}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin:12px 0}
.codes span{padding:9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:center;user-select:all}
.qr{display:block;margin:6px auto 10px;width:220px;height:220px;border-radius:16px;background:#fff;padding:8px}
.secret{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;text-align:center;padding:10px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);user-select:all}
.sess{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.sess:last-child{border-bottom:0}
.sess .tx{flex:1;min-width:0}.sess small{display:block;color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--ac) 18%,var(--bg));color:var(--ac);white-space:nowrap}
.ok{color:#2f9e5b}.warn{color:#d9822b}
details{margin-top:6px}summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 4px}
/* sélection + toasts */
#sel{position:fixed;z-index:60;display:none;align-items:center;gap:10px;padding:8px 12px;background:#24252b;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
#sel button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.85);padding:0;transition:transform .12s}#sel button:hover{transform:scale(1.15)}
#sel .x{background:none;border-color:transparent;color:#fff;display:grid;place-items:center}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,20px);background:#24252b;color:#fff;padding:11px 20px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-weight:550;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px);text-align:center}
#msg.on{opacity:1;transform:translate(-50%,0)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- collections ---------- */
.cols{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 20px;margin:0 -4px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:none;width:156px;cursor:pointer;scroll-snap-align:start;min-width:0}
.stack{position:relative;height:132px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--surface));border:1px solid var(--line);overflow:hidden;transition:transform .2s}
.col:hover .stack{transform:translateY(-3px)}
.stack .cover{position:absolute;left:50%;bottom:-26px;width:70px;font-size:9px;padding:7px;border-radius:7px;transform-origin:50% 100%}
.stack .cover:nth-child(1){transform:translateX(-50%) translateX(-36px) rotate(-11deg)}
.stack .cover:nth-child(2){transform:translateX(-50%) translateX(36px) rotate(11deg)}
.stack .cover:nth-child(3){transform:translateX(-50%) translateY(-10px);z-index:2}
.stack .cover:only-child{transform:translateX(-50%) translateY(-10px)}
.col .t{margin-top:9px;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.col .a{color:var(--muted);font-size:13px}
.stack>svg.i{position:absolute;inset:0;margin:auto;width:34px;height:34px;color:var(--ac);opacity:.55}
.col.auto .stack{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 30%,var(--bg)),color-mix(in srgb,var(--ac) 8%,var(--bg)))}
.col.new .stack{background:transparent;border:2px dashed var(--line);display:grid;place-items:center;color:var(--ac)}
.col.new .stack svg.i{width:30px;height:30px}
.sect .sh{display:flex;align-items:center;gap:6px;min-width:0}.sect .sh h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect .tools{display:flex;align-items:center;gap:4px;flex:none}.sect .tools .btn{padding:8px 14px;font-size:14px}
#sect{align-items:center}
.bhead{display:flex;gap:16px;align-items:center;margin-bottom:6px}.bhead .cover{width:78px;flex:none;font-size:11px;padding:8px}
.bhead h4{margin:0 0 2px;font-size:18px;line-height:1.25}.bhead p{margin:0;color:var(--muted)}
.citem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;font-weight:550}
.citem:hover{background:var(--soft)}.citem .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s}
.citem.on .ck{background:var(--ac);border-color:var(--ac);color:var(--acfg)}.citem .ck svg.i{width:15px;height:15px;stroke-width:3}
.citem small{margin-left:auto;color:var(--muted);font-weight:500}
.citem .mc{width:34px;flex:none}.citem .mc .cover{font-size:6px;padding:3px;border-radius:5px;box-shadow:none}
.citem .tx{flex:1;min-width:0}.citem .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.citem .tx span{display:block;color:var(--muted);font-size:12px;font-weight:500}
#mobileFab{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:5;display:flex;align-items:center;gap:9px;border:1px solid var(--line);
 background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:10px 18px 10px 14px;
 font-weight:600;font-size:14px;color:var(--fg);box-shadow:var(--shadow);transition:transform .15s}
#mobileFab:hover{transform:translateY(-2px)}#mobileFab svg.i{color:var(--ac)}
@media (max-width:700px){#mobileFab{display:none}}html.phone #mobileFab{display:none}
#imgm{position:fixed;z-index:65;display:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px}
#imgm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left}
#imgm button:hover{background:var(--soft)}
